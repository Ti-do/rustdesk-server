# GitHub Actions workflow to build patched rustdesk-server
#
# Usage:
#   1. Fork https://github.com/rustdesk/rustdesk-server on GitHub
#   2. Add this file at .github/workflows/build-patched.yml
#   3. Push - build starts automatically (or trigger manually from Actions tab)
#   4. Go to Actions tab, download the artifact (hbbs + hbbr binaries)
#
# The patch script is embedded inline - no separate file needed.

name: Build Patched RustDesk Server

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsodium-dev libsqlite3-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create patch script
        run: |
          cat << 'PATCHEOF' > patch_rustdesk_server.py
          #!/usr/bin/env python3
          """Patch rustdesk-server to support TCP peer registration (v3)."""
          import sys, os

          def patch_file(filepath):
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              original = content
              patches_applied = 0
              patches_failed = []

              # Patch 1: Add send_to_tcp_push and send_to_peer after send_to_tcp_sync
              new_fns = '''
              #[inline]
              async fn send_to_tcp_push(&mut self, msg: RendezvousMessage, addr: SocketAddr) {
                  let mut tcp_punch = self.tcp_punch.lock().await;
                  let mut sink = tcp_punch.remove(&try_into_v4(addr));
                  Self::send_to_sink(&mut sink, msg).await;
                  if sink.is_some() {
                      tcp_punch.insert(try_into_v4(addr), sink.unwrap());
                  }
              }

              #[inline]
              async fn send_to_peer(&mut self, msg: RendezvousMessage, addr: SocketAddr) {
                  let has_tcp = self.tcp_punch.lock().await.contains_key(&try_into_v4(addr));
                  if has_tcp {
                      self.send_to_tcp_push(msg, addr).await;
                  } else {
                      self.tx.send(Data::Msg(msg.into(), addr)).ok();
                  }
              }
          '''
              sync_anchor = '''    #[inline]
              async fn send_to_tcp_sync(
                  &mut self,
                  msg: RendezvousMessage,
                  addr: SocketAddr,
              ) -> ResultType<()> {
                  let mut sink = self.tcp_punch.lock().await.remove(&try_into_v4(addr));
                  Self::send_to_sink(&mut sink, msg).await;
                  Ok(())
              }'''
              if sync_anchor in content:
                  content = content.replace(sync_anchor, sync_anchor + new_fns)
                  patches_applied += 1
                  print("[OK] Patch 1: Added send_to_tcp_push + send_to_peer")
              else:
                  patches_failed.append("Patch 1: send_to_tcp_sync anchor not found")
                  print("[FAIL] Patch 1: send_to_tcp_sync anchor not found")

              # Patch 2: Add RegisterPeer handling in handle_tcp
              register_peer_code = '''                Some(rendezvous_message::Union::RegisterPeer(rp)) => {
                              // TCP registration support (patched)
                              if !rp.id.is_empty() {
                                  log::info!("TCP register peer: {:?} {:?}", &rp.id, &addr);
                                  let request_pk = if let Some(peer) = self.pm.get_or(&rp.id).await {
                                      let mut p = peer.write().await;
                                      let ip = addr.ip();
                                      let ip_change = if p.socket_addr.port() != 0 {
                                          ip != p.socket_addr.ip()
                                      } else {
                                          ip.to_string() != p.info.ip
                                      } && !ip.is_loopback();
                                      let req_pk = p.pk.is_empty() || ip_change;
                                      if !req_pk {
                                          p.socket_addr = addr;
                                          p.last_reg_time = Instant::now();
                                      }
                                      if ip_change && p.reg_pk.0 <= 2 {
                                          let old_addr = if p.socket_addr.port() == 0 {
                                              p.info.ip.clone()
                                          } else {
                                              p.socket_addr.to_string()
                                          };
                                          log::info!("IP change of {} from {} to {}", rp.id, old_addr, addr);
                                      }
                                      req_pk
                                  } else {
                                      true
                                  };
                                  let mut msg_out = RendezvousMessage::new();
                                  msg_out.set_register_peer_response(RegisterPeerResponse {
                                      request_pk,
                                      ..Default::default()
                                  });
                                  if sink.is_some() {
                                      Self::send_to_sink(sink, msg_out).await;
                                      if let Some(s) = sink.take() {
                                          self.tcp_punch.lock().await.insert(try_into_v4(addr), s);
                                      }
                                  } else {
                                      self.send_to_tcp_push(msg_out, addr).await;
                                  }
                                  if self.inner.serial > rp.serial {
                                      let mut msg_out = RendezvousMessage::new();
                                      msg_out.set_configure_update(ConfigUpdate {
                                          serial: self.inner.serial,
                                          rendezvous_servers: (*self.rendezvous_servers).clone(),
                                          ..Default::default()
                                      });
                                      self.send_to_tcp_push(msg_out, addr).await;
                                  }
                              }
                              return true;
                          }
                          Some(rendezvous_message::Union::PunchHoleRequest(ph)) => {
                              // there maybe several attempt, so sink can be none'''
              old_punch_hole_start = '''                Some(rendezvous_message::Union::PunchHoleRequest(ph)) => {
                              // there maybe several attempt, so sink can be none'''
              if old_punch_hole_start in content:
                  content = content.replace(old_punch_hole_start, register_peer_code, 1)
                  patches_applied += 1
                  print("[OK] Patch 2: Added RegisterPeer in handle_tcp")
              else:
                  alt = '''                Some(rendezvous_message::Union::PunchHoleRequest(ph)) => {'''
                  if alt in content:
                      content = content.replace(alt, register_peer_code, 1)
                      patches_applied += 1
                      print("[OK] Patch 2: Added RegisterPeer in handle_tcp (alt)")
                  else:
                      patches_failed.append("Patch 2: PunchHoleRequest anchor not found")
                      print("[FAIL] Patch 2: PunchHoleRequest anchor not found")

              # Patch 3: Replace RegisterPk NOT_SUPPORT with full TCP handling
              old_register_pk = '''                Some(rendezvous_message::Union::RegisterPk(_)) => {
                              let res = register_pk_response::Result::NOT_SUPPORT;
                              let mut msg_out = RendezvousMessage::new();
                              msg_out.set_register_pk_response(RegisterPkResponse {
                                  result: res.into(),
                                  ..Default::default()
                              });
                              Self::send_to_sink(sink, msg_out).await;
                          }'''
              new_register_pk = '''                Some(rendezvous_message::Union::RegisterPk(rk)) => {
                              // TCP RegisterPk support (patched)
                              if rk.uuid.is_empty() || rk.pk.is_empty() {
                                  return true;
                              }
                              let id = rk.id;
                              let ip = addr.ip().to_string();
                              if id.len() < 6 {
                                  let mut msg_out = RendezvousMessage::new();
                                  msg_out.set_register_pk_response(RegisterPkResponse {
                                      result: UUID_MISMATCH.into(),
                                      ..Default::default()
                                  });
                                  if sink.is_some() {
                                      Self::send_to_sink(sink, msg_out).await;
                                  } else {
                                      self.send_to_tcp_push(msg_out, addr).await;
                                  }
                                  return true;
                              }
                              if !self.check_ip_blocker(&ip, &id).await {
                                  let mut msg_out = RendezvousMessage::new();
                                  msg_out.set_register_pk_response(RegisterPkResponse {
                                      result: TOO_FREQUENT.into(),
                                      ..Default::default()
                                  });
                                  if sink.is_some() {
                                      Self::send_to_sink(sink, msg_out).await;
                                  } else {
                                      self.send_to_tcp_push(msg_out, addr).await;
                                  }
                                  return true;
                              }
                              let peer = self.pm.get_or(&id).await;
                              let (changed, ip_changed) = {
                                  let peer = peer.read().await;
                                  if peer.uuid.is_empty() {
                                      (true, false)
                                  } else {
                                      if peer.uuid == rk.uuid {
                                          if peer.info.ip != ip && peer.pk != rk.pk {
                                              log::warn!(
                                                  "Peer {} ip/pk mismatch: {}/{:?} vs {}/{:?}",
                                                  id, ip, rk.pk, peer.info.ip, peer.pk,
                                              );
                                              let mut msg_out = RendezvousMessage::new();
                                              msg_out.set_register_pk_response(RegisterPkResponse {
                                                  result: UUID_MISMATCH.into(),
                                                  ..Default::default()
                                              });
                                              if sink.is_some() {
                                                  Self::send_to_sink(sink, msg_out).await;
                                              } else {
                                                  self.send_to_tcp_push(msg_out, addr).await;
                                              }
                                              return true;
                                          }
                                      } else {
                                          log::warn!(
                                              "Peer {} uuid mismatch: {:?} vs {:?}",
                                              id, rk.uuid, peer.uuid
                                          );
                                          let mut msg_out = RendezvousMessage::new();
                                          msg_out.set_register_pk_response(RegisterPkResponse {
                                              result: UUID_MISMATCH.into(),
                                              ..Default::default()
                                          });
                                          if sink.is_some() {
                                              Self::send_to_sink(sink, msg_out).await;
                                          } else {
                                              self.send_to_tcp_push(msg_out, addr).await;
                                          }
                                          return true;
                                      }
                                      let ip_changed = peer.info.ip != ip;
                                      (
                                          peer.uuid != rk.uuid || peer.pk != rk.pk || ip_changed,
                                          ip_changed,
                                      )
                                  }
                              };
                              let mut req_pk = peer.read().await.reg_pk;
                              if req_pk.1.elapsed().as_secs() > 6 {
                                  req_pk.0 = 0;
                              } else if req_pk.0 > 2 {
                                  let mut msg_out = RendezvousMessage::new();
                                  msg_out.set_register_pk_response(RegisterPkResponse {
                                      result: TOO_FREQUENT.into(),
                                      ..Default::default()
                                  });
                                  if sink.is_some() {
                                      Self::send_to_sink(sink, msg_out).await;
                                  } else {
                                      self.send_to_tcp_push(msg_out, addr).await;
                                  }
                                  return true;
                              }
                              req_pk.0 += 1;
                              req_pk.1 = Instant::now();
                              peer.write().await.reg_pk = req_pk;
                              if ip_changed {
                                  let mut lock = IP_CHANGES.lock().await;
                                  if let Some((tm, ips)) = lock.get_mut(&id) {
                                      if tm.elapsed().as_secs() > IP_CHANGE_DUR {
                                          *tm = Instant::now();
                                          ips.clear();
                                          ips.insert(ip.clone(), 1);
                                      } else if let Some(v) = ips.get_mut(&ip) {
                                          *v += 1;
                                      } else {
                                          ips.insert(ip.clone(), 1);
                                      }
                                  } else {
                                      lock.insert(
                                          id.clone(),
                                          (Instant::now(), HashMap::from([(ip.clone(), 1)])),
                                      );
                                  }
                              }
                              if changed {
                                  self.pm.update_pk(id, peer, addr, rk.uuid, rk.pk, ip).await;
                              }
                              let mut msg_out = RendezvousMessage::new();
                              msg_out.set_register_pk_response(RegisterPkResponse {
                                  result: register_pk_response::Result::OK.into(),
                                  ..Default::default()
                              });
                              if sink.is_some() {
                                  Self::send_to_sink(sink, msg_out).await;
                              } else {
                                  self.send_to_tcp_push(msg_out, addr).await;
                              }
                              return true;
                          }'''
              if old_register_pk in content:
                  content = content.replace(old_register_pk, new_register_pk, 1)
                  patches_applied += 1
                  print("[OK] Patch 3: Replaced RegisterPk NOT_SUPPORT with TCP handling")
              else:
                  patches_failed.append("Patch 3: RegisterPk NOT_SUPPORT block not found")
                  print("[FAIL] Patch 3: RegisterPk NOT_SUPPORT block not found")

              # Patch 4: RelayResponse
              old_relay = '''                    allow_err!(self.send_to_tcp_sync(msg_out, addr_b).await);'''
              new_relay = '''                    self.send_to_peer(msg_out, addr_b).await;'''
              if old_relay in content:
                  content = content.replace(old_relay, new_relay, 1)
                  patches_applied += 1
                  print("[OK] Patch 4: RelayResponse -> send_to_peer")
              else:
                  patches_failed.append("Patch 4: RelayResponse anchor not found")
                  print("[FAIL] Patch 4: RelayResponse anchor not found")

              # Patch 5: RequestRelay
              old_request_relay = '''                    if let Some(peer) = self.pm.get_in_memory(&rf.id).await {
                                      let mut msg_out = RendezvousMessage::new();
                                      rf.socket_addr = AddrMangle::encode(addr).into();
                                      msg_out.set_request_relay(rf);
                                      let peer_addr = peer.read().await.socket_addr;
                                      self.tx.send(Data::Msg(msg_out.into(), peer_addr)).ok();
                                  }'''
              new_request_relay = '''                    if let Some(peer) = self.pm.get_in_memory(&rf.id).await {
                                      let mut msg_out = RendezvousMessage::new();
                                      rf.socket_addr = AddrMangle::encode(addr).into();
                                      msg_out.set_request_relay(rf);
                                      let peer_addr = peer.read().await.socket_addr;
                                      self.send_to_peer(msg_out, peer_addr).await;
                                  }'''
              if old_request_relay in content:
                  content = content.replace(old_request_relay, new_request_relay, 1)
                  patches_applied += 1
                  print("[OK] Patch 5: RequestRelay -> send_to_peer")
              else:
                  patches_failed.append("Patch 5: RequestRelay anchor not found")
                  print("[FAIL] Patch 5: RequestRelay anchor not found")

              # Patch 6: handle_tcp_punch_hole_request
              old_punch_req = '''    async fn handle_tcp_punch_hole_request(
                  &mut self,
                  addr: SocketAddr,
                  ph: PunchHoleRequest,
                  key: &str,
                  ws: bool,
              ) -> ResultType<()> {
                  let (msg, to_addr) = self.handle_punch_hole_request(addr, ph, key, ws).await?;
                  if let Some(addr) = to_addr {
                      self.tx.send(Data::Msg(msg.into(), addr))?;
                  } else {
                      self.send_to_tcp_sync(msg, addr).await?;
                  }
                  Ok(())
              }'''
              new_punch_req = '''    async fn handle_tcp_punch_hole_request(
                  &mut self,
                  addr: SocketAddr,
                  ph: PunchHoleRequest,
                  key: &str,
                  ws: bool,
              ) -> ResultType<()> {
                  let (msg, to_addr) = self.handle_punch_hole_request(addr, ph, key, ws).await?;
                  if let Some(peer_addr) = to_addr {
                      self.send_to_peer(msg, peer_addr).await;
                  } else {
                      self.send_to_tcp_push(msg, addr).await;
                  }
                  Ok(())
              }'''
              if old_punch_req in content:
                  content = content.replace(old_punch_req, new_punch_req, 1)
                  patches_applied += 1
                  print("[OK] Patch 6: handle_tcp_punch_hole_request -> send_to_peer")
              else:
                  patches_failed.append("Patch 6: handle_tcp_punch_hole_request anchor not found")
                  print("[FAIL] Patch 6: handle_tcp_punch_hole_request anchor not found")

              # Patch 7: handle_hole_sent
              old_hole_sent = '''        if let Ok(t) = phs.nat_type.enum_value() {
                      p.set_nat_type(t);
                  }
                  msg_out.set_punch_hole_response(p);
                  if let Some(socket) = socket {
                      socket.send(&msg_out, addr_a).await?;
                  } else {
                      self.send_to_tcp(msg_out, addr_a).await;
                  }
                  Ok(())'''
              new_hole_sent = '''        if let Ok(t) = phs.nat_type.enum_value() {
                      p.set_nat_type(t);
                  }
                  msg_out.set_punch_hole_response(p);
                  if let Some(socket) = socket {
                      socket.send(&msg_out, addr_a).await?;
                  } else {
                      self.send_to_peer(msg_out, addr_a).await;
                  }
                  Ok(())'''
              if old_hole_sent in content:
                  content = content.replace(old_hole_sent, new_hole_sent, 1)
                  patches_applied += 1
                  print("[OK] Patch 7: handle_hole_sent -> send_to_peer")
              else:
                  patches_failed.append("Patch 7: handle_hole_sent anchor not found")
                  print("[FAIL] Patch 7: handle_hole_sent anchor not found")

              # Patch 8: handle_local_addr
              old_local_addr = '''        p.set_is_local(true);
                  msg_out.set_punch_hole_response(p);
                  if let Some(socket) = socket {
                      socket.send(&msg_out, addr_a).await?;
                  } else {
                      self.send_to_tcp(msg_out, addr_a).await;
                  }
                  Ok(())'''
              new_local_addr = '''        p.set_is_local(true);
                  msg_out.set_punch_hole_response(p);
                  if let Some(socket) = socket {
                      socket.send(&msg_out, addr_a).await?;
                  } else {
                      self.send_to_peer(msg_out, addr_a).await;
                  }
                  Ok(())'''
              if old_local_addr in content:
                  content = content.replace(old_local_addr, new_local_addr, 1)
                  patches_applied += 1
                  print("[OK] Patch 8: handle_local_addr -> send_to_peer")
              else:
                  patches_failed.append("Patch 8: handle_local_addr anchor not found")
                  print("[FAIL] Patch 8: handle_local_addr anchor not found")

              if content == original:
                  print("\n[ERROR] No patches were applied! File unchanged.")
                  sys.exit(1)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"\n=== Patch Summary ===")
              print(f"Applied: {patches_applied}/8 patches")
              if patches_failed:
                  print(f"Failed: {len(patches_failed)}")
                  for p in patches_failed:
                      print(f"  - {p}")
                  print("\n[WARNING] Some patches failed.")
                  sys.exit(1)
              else:
                  print("All patches applied successfully!")
                  print(f"Modified: {filepath}")

          if __name__ == '__main__':
              filepath = sys.argv[1] if len(sys.argv) > 1 else 'src/rendezvous_server.rs'
              if not os.path.exists(filepath):
                  print(f"[ERROR] File not found: {filepath}")
                  sys.exit(1)
              print(f"Patching: {filepath}")
              patch_file(filepath)
          PATCHEOF

      - name: Apply TCP registration patch
        run: python3 patch_rustdesk_server.py src/rendezvous_server.rs

      - name: Verify patch applied
        run: |
          echo "=== Checking for patched code ==="
          grep -c "send_to_tcp_push" src/rendezvous_server.rs || true
          grep -c "send_to_peer" src/rendezvous_server.rs || true
          grep -c "TCP register peer" src/rendezvous_server.rs || true
          echo "=== Patch verification done ==="

      - name: Build
        run: cargo build --release --bin hbbs --bin hbbr

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-tcp-patched
          path: |
            target/release/hbbs
            target/release/hbbr
          retention-days: 30
