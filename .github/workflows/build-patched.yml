# GitHub Actions workflow to build patched rustdesk-server
# 
# Usage:
#   1. Fork https://github.com/rustdesk/rustdesk-server on GitHub
#   2. Create directory: .github/workflows/ in your fork
#   3. Copy this file there as build-patched.yml
#   4. Also copy patch_rustdesk_server.py to the repo root
#   5. Push to GitHub - the build will start automatically
#   6. Go to Actions tab, download the artifact (hbbs + hbbr binaries)
#   7. SCP the binaries to your server

name: Build Patched RustDesk Server

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsodium-dev libsqlite3-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply TCP registration patch
        run: python3 patch_rustdesk_server.py src/rendezvous_server.rs

      - name: Build
        run: cargo build --release --bin hbbs --bin hbbr

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-tcp-patched
          path: |
            target/release/hbbs
            target/release/hbbr
          retention-days: 30
