# GitHub Actions workflow to build patched rustdesk-server
#
# Usage:
#   1. Fork https://github.com/rustdesk/rustdesk-server on GitHub
#   2. Replace .github/workflows/build-patched.yml with this file
#   3. Push or manually trigger from Actions tab
#   4. Download the artifact (hbbs + hbbr binaries) from the run page
#
# The patch script is base64-embedded - no separate file needed.

name: Build Patched RustDesk Server

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsodium-dev libsqlite3-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create and run patch script
        run: |
          echo "" | base64 -d > patch_rustdesk_server.py
          chmod +x patch_rustdesk_server.py
          python3 patch_rustdesk_server.py src/rendezvous_server.rs

      - name: Verify patch applied
        run: |
          echo "=== Checking for patched code ==="
          grep -c "send_to_tcp_push" src/rendezvous_server.rs || true
          grep -c "send_to_peer" src/rendezvous_server.rs || true
          grep -c "TCP register peer" src/rendezvous_server.rs || true
          echo "=== Patch verification done ==="

      - name: Build
        run: cargo build --release --bin hbbs --bin hbbr

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-tcp-patched
          path: |
            target/release/hbbs
            target/release/hbbr
          retention-days: 30
